<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Our Little Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login">
    <div class="win focused" id="login-win">
      <div class="titlebar"><span class="title" id="login-title"></span><button class="tbtn" aria-label="close">✕</button></div>
      <div class="login-body">
        <div class="login-key">🔑</div>
        <div class="login-main">
          <p id="login-msg"></p>
          <label><span>User name:</span> <input id="login-user" disabled></label>
          <label><span>Password:</span> <input id="login-pw" type="password" autocomplete="off" autofocus></label>
          <p id="login-err" hidden>Wrong Password!</p>
        </div>
        <div class="login-btns">
          <button class="btn" id="login-ok">OK</button>
          <button class="btn" id="login-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div id="desktop" hidden></div>
  <div id="desktop-memos" hidden></div>
  <div id="memo-placement" hidden>
    <p role="status">메모를 붙일 곳을 눌러 주세요. <button id="memo-placement-cancel" class="btn">취소</button></p>
    <div class="memo-preview" aria-hidden="true">Memo</div>
  </div>
  <div id="windows"></div>

  <div id="startmenu" hidden>
    <div class="sm-side"><span id="sm-title"></span></div>
    <div class="sm-items">
      <section id="renewal-notice" class="renewal-notice" aria-labelledby="renewal-title" hidden>
        <span class="renewal-label">! 알림</span>
        <p id="renewal-timing"></p>
        <p id="renewal-title">기간을 연장하시겠습니까?</p>
        <a id="renewal-link" href="https://urluv.shop/" target="_blank" rel="noopener noreferrer">Yes ↗</a>
      </section>
      <button data-act="story">📄 Our Story</button>
      <button data-act="booth">📷 Photobooth</button>
      <button data-act="paint">🎨 Paint</button>
      <hr>
      <button data-act="logout">🔒 Log Off</button>
    </div>
  </div>

  <div id="taskbar" hidden>
    <span id="renewal-badge" aria-hidden="true" hidden>!</span>
    <button id="start" class="btn" aria-label="Start" aria-expanded="false" aria-controls="startmenu">
      🍀 Start
    </button>
    <div class="sep"></div>
    <button id="memo-add" class="btn">메모 추가</button>
    <button id="memo-toggle" class="btn" aria-controls="desktop-memos" aria-expanded="true">메모 숨기기</button>
    <div id="tasks"></div>
    <div class="sep"></div>
    <div id="tray">
      <span id="dday" title="D-day"></span>
      <span id="clover" title="clover">🍀</span>
      <span id="clock"></span>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="memos.js"></script>
  <script src="renewal.js"></script>
  <script src="minesweeper.js"></script>
  <script src="app.js"></script>
</body>
</html>
